name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          java -version

          if [ -z "${JAVA_HOME:-}" ] || [ ! -x "${JAVA_HOME}/bin/java" ]; then
            echo "::error::JAVA_HOME is not set or java binary is missing."
            exit 1
          fi

          VERSION_STRING="$(java -version 2>&1 | awk -F '"' '/version/ {print $2; exit}')"
          if [ -z "${VERSION_STRING}" ]; then
            echo "::error::Unable to detect active Java version."
            exit 1
          fi

          if [[ "${VERSION_STRING}" == 1.* ]]; then
            MAJOR_VERSION="$(echo "${VERSION_STRING}" | cut -d'.' -f2)"
          else
            MAJOR_VERSION="$(echo "${VERSION_STRING}" | cut -d'.' -f1)"
          fi

          if ! [[ "${MAJOR_VERSION}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse Java major version from '${VERSION_STRING}'."
            exit 1
          fi

          echo "Detected Java major version: ${MAJOR_VERSION}"
          if [ "${MAJOR_VERSION}" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but found Java ${MAJOR_VERSION}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYTOOL="${JAVA_HOME}/bin/keytool"
          if [ ! -x "${KEYTOOL}" ]; then
            echo "::error::keytool not found at ${KEYTOOL}."
            exit 1
          fi

          if [ ! -f "./debug.keystore" ]; then
            "${KEYTOOL}" -genkeypair \
              -noprompt \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::Temporary debug keystore ./debug.keystore could not be created."
            exit 1
          fi
          echo "Temporary debug keystore verified at ./debug.keystore."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "${APK_PATH}" ]; then
            echo "::error::Expected debug APK not found at ${APK_PATH}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files under app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "${APK_PATH}" ]; then
            echo "::error::${APK_PATH} is not a regular file."
            exit 1
          fi

          if [ ! -s "${APK_PATH}" ]; then
            echo "::error::${APK_PATH} is empty."
            exit 1
          fi

          if [[ "${APK_PATH}" != *.apk ]]; then
            echo "::error::${APK_PATH} does not have the .apk extension."
            exit 1
          fi

          echo "Verified debug APK: ${APK_PATH} ($(wc -c < "${APK_PATH}") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${SOURCE_APK}" ] || [ ! -s "${SOURCE_APK}" ]; then
            echo "::error::Verified APK missing at ${SOURCE_APK}."
            exit 1
          fi

          RAW_REPO="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO="$(echo "${RAW_REPO}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "${SAFE_REPO}" ]; then
            SAFE_REPO="android-app"
          fi

          ASSET_FILENAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_DIR="${RUNNER_TEMP}/release-asset"
          mkdir -p "${RELEASE_DIR}"
          ASSET_PATH="${RELEASE_DIR}/${ASSET_FILENAME}"

          cp "${SOURCE_APK}" "${ASSET_PATH}"

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "::error::Prepared release asset is invalid at ${ASSET_PATH}."
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${ASSET_FILENAME}" >> "${GITHUB_OUTPUT}"
          echo "Prepared release asset filename: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "::error::Prepared release asset is missing, empty, or not an .apk file."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          printf '%s\n' \
            "This is an automatically generated debug APK built by GitHub Actions." \
            "" \
            "- **Run Number:** ${GITHUB_RUN_NUMBER}" \
            "- **Run Attempt:** ${GITHUB_RUN_ATTEMPT}" \
            "- **Source Commit SHA:** ${GITHUB_SHA}" \
            "" \
            "This APK is intended for testing. It is not a Play Store production release and is signed only with a temporary debug keystore." \
            > "${NOTES_FILE}"

          gh release create "${RELEASE_TAG}" \
            "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --target "${GITHUB_SHA}" \
            --notes-file "${NOTES_FILE}" \
            --latest

      - name: Report APK download result
        if: ${{ always() && steps.prepare_asset.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "${PUBLISH_OUTCOME}" = "success" ]; then
            RELEASE_URL="$(gh release view "${RELEASE_TAG}" --json url --jq '.url')"
            VERIFIED_ASSET="$(gh release view "${RELEASE_TAG}" --json assets --jq --arg name "${ASSET_NAME}" '.assets[] | select(.name == $name) | .name')"
            if [ -z "${RELEASE_URL}" ] || [ -z "${VERIFIED_ASSET}" ]; then
              echo "::warning::Release was created, but expected asset '${ASSET_NAME}' could not be confirmed via gh release view."
            fi
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${VERIFIED_ASSET:-${ASSET_NAME}}"

            {
              echo "### Debug APK Build & Release Published"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **APK Asset Filename:** \`${VERIFIED_ASSET:-${ASSET_NAME}}\`"
              echo "- **GitHub Release Page:** ${RELEASE_URL}"
              echo ""
              echo "Download the APK directly from the **Assets** section on the release page above."
              echo "The GitHub Actions artifact \`app-debug-apk\` is also available on this workflow run as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            {
              echo "### Debug APK Build Succeeded (Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Creating the GitHub Release failed, so no release link is available for this run."
              echo ""
              echo "- **APK Build Status:** Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
              echo "- **Backup Download:** Download the GitHub Actions artifact named \`app-debug-apk\` from this workflow run."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
